# fork-pages-enable: ensure Actions picks up this workflow on kuklas/osac-ux
name: Deploy Demo to GitHub Pages

on:
  push:
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build mock website
        run: pnpm --filter @osac/app-frontend run build:mock

      # Must run after the site build: Vite empties dist/ before writing to it.
      # The built Storybook references its assets relatively, so it needs no
      # base-path configuration to be served from /osac-ux/storybook/.
      - name: Build golden-pattern Storybook into the site
        run: pnpm --filter @osac/storybook run build-storybook:pages

      - name: Verify website output
        run: |
          test -f apps/app-frontend/dist/index.html
          test -f apps/app-frontend/dist/storybook/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/app-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
